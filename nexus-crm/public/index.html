<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus CRM | Cobranças</title>
<style>
:root{--bg:#07182d;--panel:#102944;--line:#315371;--text:#f5faff;--muted:#c4d8e8;--green:#20d68b;--blue:#409eff;--orange:#ffbb48;--red:#ff6370}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:18px/1.5 Arial,sans-serif}header{background:#0c213a;padding:22px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:30px}h2{font-size:26px;margin:0 0 20px}h3{font-size:22px;margin:0}main{max-width:1250px;margin:auto;padding:20px}p{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:20px}input,textarea{width:100%;background:#06172a;color:white;border:2px solid #466783;border-radius:10px;padding:15px;font:18px Arial;margin:7px 0 15px}textarea{min-height:90px}label{display:block;font-weight:bold}button{border:0;border-radius:12px;padding:15px 19px;font:700 18px Arial;cursor:pointer;min-height:54px}button:disabled{opacity:.5}nav,.actions,.filters{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.primary{background:var(--blue);color:#06182b}.success{background:var(--green);color:#05251a}.warning{background:var(--orange);color:#271900}.danger{background:var(--red);color:#2c080d}.secondary{background:#304c69;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#193b5a;padding:18px;border-radius:14px;text-align:center}.stat strong{display:block;font-size:30px}.stat span{font-size:16px}.client{background:#0a2038;border:1px solid var(--line);padding:20px;border-radius:15px;margin:14px 0}.client p{margin:8px 0}.tag{display:inline-block;padding:6px 12px;border-radius:20px;font-size:16px;font-weight:bold;background:#34536e}.paid{background:#126b4b}.late{background:#842f3b}.awaiting{background:#8b601b}.hide{display:none!important}.modal{position:fixed;inset:0;background:#000c;display:flex;justify-content:center;align-items:center;padding:15px;z-index:10}.modal .card{max-width:700px;width:100%;max-height:90vh;overflow:auto}a{color:#85caff;overflow-wrap:anywhere}pre{background:#061626;padding:15px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}#message{position:fixed;bottom:15px;left:15px;right:15px;max-width:700px;margin:auto;background:#164a67;border:1px solid #6fbfff;padding:18px;border-radius:12px;z-index:20}@media(max-width:650px){main{padding:12px}h1{font-size:25px}.stats{grid-template-columns:1fr}nav button,.filters button{flex:1}.actions button{width:100%}}
</style></head><body>
<header><h1>💳 Nexus CRM de Cobrança</h1></header><main>
<section id="loginView" class="card"><h2>Entrar no sistema</h2><form id="loginForm"><label>Senha administrativa<input id="password" type="password" autocomplete="current-password" required></label><button class="success">Entrar</button></form></section>
<section id="appView" class="hide"><nav><button class="primary" onclick="showSection('dashboard')">Clientes</button><button class="secondary" onclick="showSection('settings')">Configurações</button><button class="danger" onclick="logout()">Sair</button></nav>
<section id="dashboard"><div class="stats"><div class="stat"><strong id="total">0</strong><span>Clientes</span></div><div class="stat"><strong id="late">0</strong><span>Atrasados</span></div><div class="stat"><strong id="paid">0</strong><span>Pagos este mês</span></div></div>
<div class="card"><h2 id="formTitle">Cadastrar cliente</h2><form id="clientForm"><input type="hidden" id="clientId"><div class="grid"><label>Nome<input id="name" required maxlength="150"></label><label>WhatsApp com DDD<input id="whatsapp" inputmode="tel" placeholder="21999999999" required></label><label>Valor mensal (R$)<input id="amount" type="number" min="0.01" step="0.01" required></label><label>Dia de vencimento<input id="dueDay" type="number" min="1" max="31" required></label></div><label>Observações<textarea id="notes"></textarea></label><div class="actions"><button class="success">Salvar cliente</button><button type="button" class="secondary" onclick="resetForm()">Cancelar edição</button></div></form></div>
<div class="card"><h2>Lista de clientes</h2><div class="filters"><button class="primary" onclick="setFilter('all')">Todos</button><button class="secondary" onclick="setFilter('week')">Vence esta semana</button><button class="warning" onclick="setFilter('late')">Atrasados</button><button class="success" onclick="setFilter('paid')">Pagos este mês</button></div><div id="clients"></div></div></section>
<section id="settings" class="card hide"><h2>Configurações da empresa e Pix</h2><form id="settingsForm"><label>Nome da empresa<input id="companyName" required></label><label>Chave Pix<input id="pixKey" required placeholder="CPF, CNPJ, e-mail, +5521999999999 ou chave aleatória"></label><p>Se a chave for celular, escreva com +55 na frente. Ex.: +5521964816185</p><label>Nome do recebedor<input id="receiverName" required></label><label>Cidade do recebedor<input id="receiverCity" required></label><button class="success">Salvar configurações</button></form><p>Alterações da chave Pix não modificam cobranças já geradas.</p></section></section></main>
<div id="modal" class="modal hide"><div class="card"><button class="secondary" onclick="closeModal()">Fechar</button><div id="modalContent"></div></div></div><div id="message" class="hide"></div>
<script>
let clients=[],today='',filter='all';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const brl=v=>(v/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function notify(t){$('message').textContent=t;$('message').classList.remove('hide');setTimeout(()=>$('message').classList.add('hide'),4500)}
async function api(path,opts={}){const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opts}),x=await r.json();if(!r.ok){if(r.status===401&&path!='/api/login'){$('appView').classList.add('hide');$('loginView').classList.remove('hide')}throw Error(x.error||'Erro de comunicação.')}return x}
function showSection(n){$('dashboard').classList.toggle('hide',n!=='dashboard');$('settings').classList.toggle('hide',n!=='settings')}function openModal(h){$('modalContent').innerHTML=h;$('modal').classList.remove('hide')}function closeModal(){$('modal').classList.add('hide')}
function due(month,day){const [y,m]=month.split('-').map(Number);return month+'-'+String(Math.min(day,new Date(Date.UTC(y,m,0)).getUTCDate())).padStart(2,'0')}function addDays(date,n){const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}const paid=c=>c.charge_status==='paid',late=c=>!paid(c)&&due(today.slice(0,7),c.due_day)<today;function setFilter(v){filter=v;render()}
function render(){const month=today.slice(0,7),end=addDays(today,6);$('total').textContent=clients.length;$('late').textContent=clients.filter(late).length;$('paid').textContent=clients.filter(paid).length;const visible=clients.filter(c=>{const d=due(month,c.due_day);return filter==='week'?!paid(c)&&d>=today&&d<=end:filter==='late'?late(c):filter==='paid'?paid(c):true});$('clients').innerHTML=visible.map(c=>{const [label,cls]=paid(c)?['Pago','paid']:c.charge_status==='awaiting'?['Aguardando confirmação','awaiting']:late(c)?['Atrasado','late']:['Em aberto',''];return `<article class="client"><h3>${esc(c.name)}</h3><span class="tag ${cls}">${label}</span><p><b>Mensalidade:</b> ${brl(c.monthly_amount)}</p><p><b>Vencimento:</b> ${due(month,c.due_day).split('-').reverse().join('/')}</p><p><b>WhatsApp:</b> ${esc(c.whatsapp)}</p>${c.notes?`<p>${esc(c.notes)}</p>`:''}<div class="actions"><button class="warning" onclick="charge(${c.id})">Cobrar</button><button class="success" onclick="markPaid(${c.id})" ${paid(c)?'disabled':''}>Marcar como pago</button><button class="primary" onclick="verHistorico(${c.id})">Histórico</button><button class="secondary" onclick="editClient(${c.id})">Editar</button><button class="danger" onclick="deleteClient(${c.id})">Excluir</button></div></article>`}).join('')||'<p>Nenhum cliente neste filtro.</p>'}
async function loadClients(){const x=await api('/api/clients');clients=x.clients;today=x.today;render()}async function loadSettings(){const s=await api('/api/settings');$('companyName').value=s.company_name||'';$('pixKey').value=s.pix_key||'';$('receiverName').value=s.receiver_name||'';$('receiverCity').value=s.receiver_city||''}
function resetForm(){$('clientForm').reset();$('clientId').value='';$('formTitle').textContent='Cadastrar cliente'}function editClient(id){const c=clients.find(x=>x.id===id);if(!c)return;$('clientId').value=c.id;$('name').value=c.name;$('whatsapp').value=c.whatsapp;$('amount').value=(c.monthly_amount/100).toFixed(2);$('dueDay').value=c.due_day;$('notes').value=c.notes||'';$('formTitle').textContent='Editar cliente';showSection('dashboard');$('clientForm').scrollIntoView({behavior:'smooth'})}
async function deleteClient(id){if(!confirm('Excluir cliente e TODO o histórico?'))return;try{await api('/api/clients/'+id,{method:'DELETE'});notify('Cliente excluído.');await loadClients()}catch(e){alert(e.message)}}
async function charge(id){try{const x=await api(`/api/clients/${id}/charge`,{method:'POST'});openModal(`<h2>Cobrança gerada</h2><p>Link de pagamento:</p><pre>${esc(x.payment_url)}</pre><div class="actions"><button class="success" id="copyLink">Copiar link</button><button class="primary" id="openPay">Abrir pagamento</button><button class="warning" id="openWA">Enviar pelo WhatsApp</button></div>`);$('copyLink').onclick=()=>copyText(x.payment_url);$('openPay').onclick=()=>window.open(x.payment_url,'_blank','noopener');$('openWA').onclick=()=>window.open(x.whatsapp_url,'_blank','noopener');await loadClients()}catch(e){alert(e.message)}}
async function copyText(v){try{await navigator.clipboard.writeText(v);notify('Copiado!')}catch{prompt('Copie:',v)}}async function markPaid(id){if(!confirm('Confirmar pagamento da mensalidade atual?'))return;try{await api(`/api/clients/${id}/paid`,{method:'POST'});notify('Pagamento confirmado.');await loadClients()}catch(e){alert(e.message)}}
async function verHistorico(id){try{const x=await api(`/api/clients/${id}/history`),c=clients.find(c=>c.id===id);openModal(`<h2>Histórico — ${esc(c?.name||'')}</h2>`+(x.history.map(h=>`<div class="client"><b>Referência: ${esc(h.reference_month)}</b><p>Valor: ${brl(h.amount)}</p><p>Vencimento: ${esc(h.due_date)}</p><p>Situação: ${h.status==='paid'?'Pago':h.status==='awaiting'?'Aguardando confirmação':'Em aberto'}</p><p>Cobrança criada: ${esc(h.created_at||'-')}</p><p>Pagamento informado: ${esc(h.reported_at||'-')}</p><p>Pagamento confirmado: ${esc(h.paid_at||'-')}</p></div>`).join('')||'<p>Sem histórico.</p>'))}catch(e){alert(e.message)}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';await startApp()}catch(e){alert(e.message)}});
$('clientForm').addEventListener('submit',async e=>{e.preventDefault();const id=$('clientId').value;try{await api(id?`/api/clients/${id}`:'/api/clients',{method:id?'PUT':'POST',body:JSON.stringify({name:$('name').value,whatsapp:$('whatsapp').value,monthly_amount:Math.round(Number($('amount').value)*100),due_day:Number($('dueDay').value),notes:$('notes').value})});resetForm();notify('Cliente salvo.');await loadClients()}catch(e){alert(e.message)}});
$('settingsForm').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/settings',{method:'PUT',body:JSON.stringify({company_name:$('companyName').value,pix_key:$('pixKey').value,receiver_name:$('receiverName').value,receiver_city:$('receiverCity').value})});notify('Configurações salvas.')}catch(e){alert(e.message)}});
async function logout(){await api('/api/logout',{method:'POST'});$('appView').classList.add('hide');$('loginView').classList.remove('hide')}async function startApp(){$('loginView').classList.add('hide');$('appView').classList.remove('hide');await Promise.all([loadClients(),loadSettings()])}(async()=>{try{await api('/api/me');await startApp()}catch{$('loginView').classList.remove('hide')}})();
</script></body></html>

<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar Comercial Flow Arts</title><style>body{font:15px system-ui;background:#eef3fa;color:#17304e;margin:0}main{max-width:1080px;margin:30px auto;padding:20px}section{background:white;padding:22px;border-radius:16px;margin:15px 0;box-shadow:0 3px 14px #213a5712}label{display:block;margin-top:10px;font-weight:600}input,select,textarea,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #bdc9d8}input,textarea,select{width:100%;box-sizing:border-box}button{cursor:pointer;background:#164b95;color:white;border:0;margin:5px 5px 5px 0}button.secondary{background:#edf3fb;color:#164b95}article{border-top:1px solid #dce4ef;padding:15px 0}.muted{color:#52677c}a{color:#1752a0}small{color:#52677c}h1{margin-bottom:4px}</style><main><h1>Radar Comercial Flow Arts</h1><p class="muted">Uso exclusivo do Master. Fontes públicas ou autorizadas; nenhuma mensagem é enviada automaticamente.</p><section><h2>Registrar oportunidade</h2><form id="add"><label>@ da empresa<input name="instagram" placeholder="@empresa" required></label><label>Categoria<select name="category"><option value="site">Criação e melhoria de sites</option><option value="instagram">Automação Instagram</option><option value="leads">Captação de leads</option><option value="prospeccao">Prospecção e locação B2B</option></select></label><label>Nome da empresa<input name="business"></label><label>@ concorrente<input name="competitor"></label><label>Comentário ou evidência<textarea name="evidence" required></textarea></label><label>Link da publicação/evidência (https)<input name="evidence_url" type="url" required></label><label>Site empresarial (opcional)<input name="website" type="url"></label><label>WhatsApp comercial divulgado publicamente<input name="whatsapp" placeholder="55 DDD número"></label><label>URL pública que comprova o contato<input name="contact_source" type="url"></label><label>Observações<textarea name="notes"></textarea></label><button>Salvar e qualificar</button></form><p id="notice" role="status"></p></section><section><h2>Oportunidades</h2><button class="secondary" id="refresh">Atualizar</button><select id="filter"><option value="">Todas as categorias</option><option value="site">Sites</option><option value="instagram">Instagram</option><option value="leads">Leads</option><option value="prospeccao">Prospecção B2B</option></select><div id="leads">Carregando...</div></section></main><script src="/commercial-radar.js"></script></html>

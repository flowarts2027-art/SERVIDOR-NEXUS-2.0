<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F1E3D">
  <title>Meu Instagram · Painel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="/client-lite.css?v=101">
  <script src="/client-lite.js?v=102" defer></script>
</head>
<body>
  <main id="login" class="login" hidden>
    <section class="login-card">
      <p class="login-brand">Painel do cliente</p>
      <h1>Entre para ver o seu Instagram</h1>
      <form id="login-form">
        <label>Usuário<input name="username" autocomplete="username" required></label>
        <label>Senha<input name="password" type="password" autocomplete="current-password" required></label>
        <label class="check"><input id="login-save-password" type="checkbox"> Lembrar a senha neste aparelho</label>
        <button type="submit" class="btn btn-primary">Entrar</button>
        <p id="login-error" class="form-error" role="alert"></p>
      </form>
    </section>
  </main>

  <div id="app" class="app" hidden>
    <header class="top">
      <div class="top-inner">
        <div>
          <p class="hello" id="hello">Olá</p>
          <p class="status" id="agent-status"><span class="dot"></span><span>Carregando…</span></p>
        </div>
        <button id="refresh" class="icon-btn" type="button" aria-label="Atualizar">↻</button>
      </div>
    </header>

    <nav class="tabbar" aria-label="Seções do painel">
      <button type="button" data-tab="inicio" class="active"><span aria-hidden="true">⌂</span>Início</button>
      <button type="button" data-tab="posts"><span aria-hidden="true">▦</span>Posts<b class="badge" id="badge-posts" hidden></b></button>
      <button type="button" data-tab="numeros"><span aria-hidden="true">↗</span>Números</button>
      <button type="button" data-tab="contatos"><span aria-hidden="true">☺</span>Contatos</button>
      <button type="button" data-tab="conta"><span aria-hidden="true">⚙</span>Conta</button>
    </nav>

    <div id="toast" class="toast" role="status" hidden></div>

    <main class="content">
      <section id="tab-inicio" class="tab">
        <div id="next-post"></div>
        <div class="stats" id="home-stats"></div>
        <section class="block">
          <div class="block-head"><h2>Contatos recentes</h2><button type="button" class="link" data-go="contatos">Ver todos</button></div>
          <div id="home-leads"></div>
        </section>
      </section>

      <section id="tab-posts" class="tab" hidden>
        <h1 class="page-title">Seus posts</h1>
        <div class="segmented" role="tablist" aria-label="Filtrar posts">
          <button type="button" data-filter="aprovar" class="active">Para aprovar</button>
          <button type="button" data-filter="agendados">Agendados</button>
          <button type="button" data-filter="publicados">Publicados</button>
        </div>
        <div id="post-list" class="post-list"></div>
      </section>

      <section id="tab-numeros" class="tab" hidden>
        <h1 class="page-title">Números do Instagram</h1>
        <div id="insights"></div>
      </section>

      <section id="tab-contatos" class="tab" hidden>
        <h1 class="page-title">Contatos</h1>
        <p class="lead-intro">Pessoas que mostraram interesse nos seus posts.</p>
        <div id="lead-list"></div>
      </section>

      <section id="tab-conta" class="tab" hidden>
        <h1 class="page-title">Conta</h1>
        <section class="block" id="instagram-box"></section>
        <section class="block">
          <h2>Precisa de ajuda?</h2>
          <p class="muted">Fale direto com a nossa equipe pelo WhatsApp.</p>
          <a id="support-link" class="btn btn-whats" href="#" target="_blank" rel="noopener">Falar no WhatsApp</a>
        </section>
        <button id="logout" type="button" class="btn btn-ghost">Sair do painel</button>
      </section>
    </main>
  </div>
</body>
</html>

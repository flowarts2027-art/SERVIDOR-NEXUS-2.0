name: NEXUS YouTube Ingest

on:
  repository_dispatch:
    types: [video-youtube-ingest]

concurrency:
  group: nexus-video-youtube-${{ github.event.client_payload.job_id }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JOB_ID: ${{ github.event.client_payload.job_id }}
      CLIENT_ID: ${{ github.event.client_payload.client_id }}
      CALLBACK_TOKEN: ${{ github.event.client_payload.callback_token }}
      SOURCE_URL: ${{ github.event.client_payload.source_url }}
      SOURCE_KIND: ${{ github.event.client_payload.source_kind }}
      NEXUS_BASE_URL: https://servidor-nexus.diamantehinode2015.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install downloader
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --disable-pip-version-check --quiet --upgrade "yt-dlp[default]" "bgutil-ytdlp-pot-provider==2.0.1"
          rm -rf /tmp/bgutil-ytdlp-pot-provider
          git clone --quiet --single-branch --branch 2.0.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil-ytdlp-pot-provider
          (
            cd /tmp/bgutil-ytdlp-pot-provider/server
            npm ci --silent
            npx tsc
          )

      - name: Download compatible video source
        shell: bash
        run: |
          set -euo pipefail
          echo youtube_download_failed > /tmp/nexus-ingest-error.txt
          rm -f /tmp/source.* /tmp/source-input

          if [ "${SOURCE_KIND:-youtube}" = "catalog-preview" ]; then
            python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          u=urlparse(os.environ.get("SOURCE_URL",""))
          host=(u.hostname or "").lower()
          allowed = u.scheme == "https" and (
              host == "itunes.apple.com" or host.endswith(".itunes.apple.com") or
              host == "mzstatic.com" or host.endswith(".mzstatic.com")
          )
          if not allowed:
              raise SystemExit("catalog_preview_host_not_allowed")
          PY
            echo catalog_preview_download_failed > /tmp/nexus-ingest-error.txt
            curl --fail-with-body --location --retry 3 --retry-all-errors --max-time 120 \
              -A "Mozilla/5.0" "$SOURCE_URL" -o /tmp/source-input
            test -s /tmp/source-input
            ffmpeg -hide_banner -loglevel error -y -i /tmp/source-input \
              -c:v libx264 -preset veryfast -crf 24 -c:a aac -b:a 128k -movflags +faststart /tmp/source.mp4
          else
            echo youtube_download_failed > /tmp/nexus-ingest-error.txt
            set +e
            yt-dlp \
              --js-runtimes node \
              --extractor-args "youtube:player-client=mweb,tv,web_safari" \
              --extractor-args "youtubepot-bgutilscript:server_home=/tmp/bgutil-ytdlp-pot-provider/server" \
              --no-playlist \
              --retries 5 \
              --fragment-retries 5 \
              --concurrent-fragments 4 \
              --merge-output-format mp4 \
              -f "bv*[height<=720][ext=mp4]+ba[ext=m4a]/b[height<=720][ext=mp4]/b[height<=720]" \
              -o "/tmp/source.%(ext)s" \
              "$SOURCE_URL" 2>&1 | tee /tmp/yt-dlp.log
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -ne 0 ]; then
              if grep -qi "sign in to confirm.*not a bot\|cookies.*authentication" /tmp/yt-dlp.log; then
                echo youtube_authentication_required > /tmp/nexus-ingest-error.txt
              elif grep -qi "javascript runtime\|challenge" /tmp/yt-dlp.log; then
                echo youtube_challenge_failed > /tmp/nexus-ingest-error.txt
              fi
              exit "$STATUS"
            fi
            FILE="$(find /tmp -maxdepth 1 -type f -name 'source.*' | head -n1)"
            test -n "$FILE"
            if [ "$FILE" != "/tmp/source.mp4" ]; then
              ffmpeg -hide_banner -loglevel error -y -i "$FILE" \
                -c:v libx264 -preset veryfast -crf 24 -c:a aac -b:a 128k -movflags +faststart /tmp/source.mp4
            fi
          fi
          test -s /tmp/source.mp4

      - name: Keep source inside R2 upload limit
        shell: bash
        run: |
          set -euo pipefail
          echo youtube_prepare_failed > /tmp/nexus-ingest-error.txt
          SIZE="$(stat -c%s /tmp/source.mp4)"
          LIMIT=$((88*1024*1024))
          if [ "$SIZE" -gt "$LIMIT" ]; then
            ffmpeg -y -i /tmp/source.mp4               -vf "scale='min(1280,iw)':-2"               -c:v libx264 -preset veryfast -crf 29               -c:a aac -b:a 96k -movflags +faststart /tmp/source-small.mp4
            mv /tmp/source-small.mp4 /tmp/source.mp4
          fi
          test "$(stat -c%s /tmp/source.mp4)" -le "$LIMIT"

      - name: Upload source to NEXUS
        shell: bash
        run: |
          set -euo pipefail
          echo youtube_upload_failed > /tmp/nexus-ingest-error.txt
          curl --fail-with-body --retry 3 --retry-all-errors             -X PUT "$NEXUS_BASE_URL/api/internal/video-ingest/upload"             -H "x-nexus-job-id: $JOB_ID"             -H "x-nexus-client-id: $CLIENT_ID"             -H "x-nexus-callback-token: $CALLBACK_TOKEN"             -H "content-type: video/mp4"             -H "content-length: $(stat -c%s /tmp/source.mp4)"             --data-binary @/tmp/source.mp4

      - name: Report ingest failure
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/nexus-ingest-error.txt')
          error=p.read_text().strip() if p.exists() else 'youtube_ingest_failed'
          Path('/tmp/failure.json').write_text(json.dumps({'error': error}))
          PY
          curl --silent --show-error             -X POST "$NEXUS_BASE_URL/api/internal/video-ingest/fail"             -H "x-nexus-job-id: $JOB_ID"             -H "x-nexus-client-id: $CLIENT_ID"             -H "x-nexus-callback-token: $CALLBACK_TOKEN"             -H "content-type: application/json"             --data-binary @/tmp/failure.json

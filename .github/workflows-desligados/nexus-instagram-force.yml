name: NEXUS Instagram Force Publish

on:
  workflow_dispatch:
    inputs:
      client_id:
        description: "Client id to publish"
        required: false
        default: "globalplay-streaming"
      format:
        description: "Format to publish"
        required: false
        default: "carousel"
  push:
    branches: [main]

jobs:
  force-instagram:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d9ecb78dbc0c1b0b61f8caae501f59df
      CLIENT_ID: ${{ github.event.inputs.client_id || 'globalplay-streaming' }}
      FORMAT: ${{ github.event.inputs.format || 'carousel' }}
    steps:
      - uses: actions/checkout@v4

      - name: Force controlled Instagram publish
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          cleanup() {
            printf 'y\n' | npx wrangler secret delete EMERGENCY_TRIGGER_TOKEN >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          printf '%s' "$token" | npx wrangler secret put EMERGENCY_TRIGGER_TOKEN >/dev/null

          result=""
          http_code=""
          for attempt in 1 2 3 4 5 6; do
            body_file="$(mktemp)"
            http_code="$(curl --silent --show-error --max-time 240               -o "$body_file" -w '%{http_code}'               -X POST               -H "x-nexus-emergency-token: $token"               "https://servidor-nexus.diamantehinode2015.workers.dev/api/emergency-publish-now?clientId=$CLIENT_ID&format=$FORMAT&forceTest=1&testId=${{ github.run_id }}" || true)"
            result="$(cat "$body_file")"
            rm -f "$body_file"
            if [ "$http_code" = "200" ]; then
              break
            fi
            if [ "$http_code" != "401" ]; then
              echo "::error::Controlled publish returned HTTP $http_code"
              echo "$result" | jq . || true
              exit 1
            fi
            echo "::warning::Emergency trigger secret not propagated yet (attempt $attempt/6); retrying."
            sleep 10
          done

          if [ "$http_code" != "200" ]; then
            echo "::error::Controlled publish authorization did not propagate."
            exit 1
          fi

          echo "$result" | jq '{ok,targetClientId,format,attempted,published,errors}'
          echo "$result" | jq -e '.ok == true and .attempted == 1 and .published == 1 and (.errors | length == 0)' >/dev/null

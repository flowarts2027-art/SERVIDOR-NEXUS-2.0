name: NEXUS Agendar conteúdo pronto (pasta agendamentos)

# Todo dia (pedido do Rodrigo, 21/10): o ChatGPT faz as artes e as legendas e coloca em
# agendamentos/AAAA-MM-DD/HHMM/. Este fluxo sobe cada post novo para o painel da Flow Arts
# ESPERANDO A APROVAÇÃO do Rodrigo. Nada é publicado sem esse OK. Sem custo na OpenAI.
# Regras da pasta em .github/scripts/agendar-pasta.sh.
# Usa uma sessão de Master temporária (15 min) criada no D1 e apagada no fim.
on:
  push:
    branches: [main, agendamentos]
    paths:
      - "agendamentos/**"
  workflow_dispatch:
    inputs:
      date:
        description: "Dia para (re)enviar, AAAA-MM-DD (posts já enviados não duplicam)"
        required: true

concurrency:
  group: nexus-agendar-pasta
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  agendar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Token só de D1 (o de deploy não tem acesso ao banco); sem ele, tenta o de deploy.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d9ecb78dbc0c1b0b61f8caae501f59df
      BASE: https://servidor-nexus.diamantehinode2015.workers.dev
      AGENDAMENTOS_DIR: ${{ github.workspace }}/agendamentos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Achar os posts novos
        id: slots
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_DATE:-}" ]; then
            [[ "$INPUT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::Data inválida"; exit 1; }
            files="$(git ls-files "agendamentos/$INPUT_DATE" "agendamentos/clientes/*/$INPUT_DATE")"
          elif [ -n "${BEFORE:-}" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files="$(git diff --name-only --diff-filter=d "$BEFORE" "$GITHUB_SHA" -- agendamentos)"
          else
            files="$(git diff --name-only --diff-filter=d "$GITHUB_SHA~1" "$GITHUB_SHA" -- agendamentos 2>/dev/null || git ls-files agendamentos)"
          fi
          # Flow Arts: agendamentos/AAAA-MM-DD/HHMM/ · outro cliente: agendamentos/clientes/<id>/AAAA-MM-DD/HHMM/
          slots="$(printf '%s\n' "$files" | sed -nE 's#^agendamentos/((clientes/[a-z0-9-]+/)?[0-9]{4}-[0-9]{2}-[0-9]{2}/[0-9]{4}(-story)?)/.*#\1#p' | sort -u | tr '\n' ' ')"
          echo "::notice::Posts a enviar: ${slots:-nenhum}"
          echo "list=$slots" >> "$GITHUB_OUTPUT"
      - name: Conferir o acesso ao banco
        if: steps.slots.outputs.list != ''
        shell: bash
        run: |
          set -uo pipefail
          src="${{ secrets.CLOUDFLARE_D1_TOKEN != '' && 'CLOUDFLARE_D1_TOKEN' || 'CLOUDFLARE_API_TOKEN (deploy)' }}"
          code="$(curl -s -o /tmp/d1.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=5")"
          echo "::notice::Token usado: $src. Lista de bancos D1: HTTP $code, $(jq -c '{success, errors: [.errors[]?.code]}' /tmp/d1.json 2>/dev/null)"
      - name: Subir para o painel (esperando aprovação)
        if: steps.slots.outputs.list != ''
        working-directory: cloudflare
        shell: bash
        run: bash ../.github/scripts/agendar-pasta.sh ${{ steps.slots.outputs.list }}

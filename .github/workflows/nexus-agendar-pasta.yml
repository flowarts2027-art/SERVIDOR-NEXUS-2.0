name: NEXUS Agendar conteúdo pronto (pasta agendamentos)

# Sobe no Master › "Subir conteúdo do cliente" o que estiver em agendamentos/2026-10-19
# (carrossel 09:00, Reel 12:00, Reel como Story 19:00 — horário de Brasília), já aprovado.
# Usa uma sessão de Master temporária (15 min) criada no D1 e apagada no fim.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "agendamentos/2026-10-19/**"
      - ".github/workflows/nexus-agendar-pasta.yml"

jobs:
  agendar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d9ecb78dbc0c1b0b61f8caae501f59df
      BASE: https://servidor-nexus.diamantehinode2015.workers.dev
      DIR: ../agendamentos/2026-10-19
      DAY: "2026-10-19"
    steps:
      - uses: actions/checkout@v4
      - name: Agendar carrossel, Reel e Story da Flow Arts
        shell: bash
        run: |
          set -euo pipefail
          q() { local raw; raw="$(npx --yes wrangler@4 d1 execute servidor-nexus --remote --json --command "$1" 2>/tmp/wr.err || true)"; printf '%s' "$raw" | python3 -c 'import sys,json; t=sys.stdin.read(); i=t.find("["); print(json.dumps(json.loads(t[i:])) if i>=0 else "[]")' 2>/dev/null || { echo "::error::D1: $(printf '%s' "$raw" | tr '\n' ' ' | cut -c1-400) $(tr '\n' ' ' </tmp/wr.err | cut -c1-400)" >&2; echo "[]"; }; }
          CLIENT_ID="$(q "SELECT id FROM clients WHERE lower(id) LIKE '%flow%' OR lower(name) LIKE '%flow arts%' OR lower(COALESCE(instagram,'')) LIKE '%flowarts%' LIMIT 1" | jq -r '.[0].results[0].id // empty')"
          [ -n "$CLIENT_ID" ] || { echo "::error::Cliente Flow Arts não encontrado: $(q "SELECT id, name FROM clients" | jq -c '.[0].results' | cut -c1-600)"; exit 1; }
          echo "::notice::Cliente: $CLIENT_ID"
          token="$(openssl rand -hex 32)"
          hash="$(printf '%s' "$token" | sha256sum | cut -d' ' -f1)"
          exp="$(date -u -d '+15 minutes' +%Y-%m-%dT%H:%M:%S.000Z)"
          cleanup() { q "DELETE FROM master_sessions WHERE token_hash='$hash'" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          q "INSERT INTO master_sessions(token_hash, expires_at) VALUES('$hash', '$exp')" >/dev/null
          send() {
            local label="$1"; shift
            local out; out="$(curl -sS --max-time 300 -b "nexus_master=$token" -X POST "$BASE/api/master/upload" \
              -F "clientId=$CLIENT_ID" -F "approval=eu" -F "date=$DAY" "$@")"
            echo "::notice::$label: $(printf '%s' "$out" | tr '\n' ' ' | cut -c1-300)"
            echo "$out" | jq -e '.ok == true' >/dev/null || { echo "::error::$label falhou"; FAIL=1; }
          }
          FAIL=0
          imgs=(); for f in "$DIR"/carrossel/*.jpg; do imgs+=(-F "images=@$f;type=image/jpeg"); done
          send "Carrossel 09:00" -F "type=carousel" -F "time=09:00" -F "caption=<$DIR/legenda-carrossel.txt" "${imgs[@]}"
          send "Reel 12:00" -F "type=reel" -F "time=12:00" -F "caption=<$DIR/legenda-reel.txt" \
            -F "video=@$DIR/reel.mp4;type=video/mp4" -F "cover=@$DIR/capa.jpg;type=image/jpeg"
          send "Story 19:00" -F "type=story" -F "time=19:00" \
            -F "video=@$DIR/reel.mp4;type=video/mp4" -F "cover=@$DIR/capa.jpg;type=image/jpeg"
          exit $FAIL

name: NEXUS Atualizar mapa do Graphify

# Pedido do Rodrigo (22/10/2026): o mapa do código (graphify-out/) se atualiza sozinho,
# sem ele abrir o Claude Code no PC. A cada mudança na main, o GitHub roda
# "graphify update . --force" (só lê o código, sem IA e sem custo) e salva o mapa novo.
# --force: o mapa feito aqui é só do código; pode ter alguns itens a menos que o feito no PC.
# Só GRAPH_REPORT.md e graph.json vão para o repositório. Não mexe no site nem no painel.
on:
  push:
    branches: [main]
    paths-ignore:
      - "graphify-out/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-graphify
  cancel-in-progress: true

jobs:
  mapa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o Graphify
        run: pip install --quiet "graphifyy[sql]"

      - name: Atualizar o mapa
        shell: bash
        run: |
          set -uo pipefail
          if ! graphify update . --force > /tmp/g.log 2>&1; then
            echo "::error::graphify update falhou: $(tail -c 900 /tmp/g.log | tr '\n' ' ')"
            exit 1
          fi
          echo "::notice::$(tail -c 400 /tmp/g.log | tr '\n' ' ')"

      - name: Salvar o mapa (só se mudou)
        shell: bash
        run: |
          set -euo pipefail
          git add -f graphify-out/GRAPH_REPORT.md graphify-out/graph.json
          if git diff --cached --quiet; then
            echo "::notice::Mapa já estava atualizado."
            exit 0
          fi
          git config user.name "nexus-graphify[bot]"
          git config user.email "nexus-graphify@users.noreply.github.com"
          git commit -m "chore(graphify): atualizar mapa do código [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && { echo "::notice::Mapa atualizado."; exit 0; }
            sleep 5
          done
          echo "::error::Não deu para salvar o mapa (a main mudou ao mesmo tempo)."; exit 1

name: NEXUS CRM - contar contatos parados (so leitura)

# Pedido do Rodrigo (21/10): só contagem, sem nomes nem telefones (o log é público) e sem arquivar nada.
on:
  push:
    branches: [ops/crm-contagem]
    paths: [".github/workflows/nexus-crm-contagem.yml"]

permissions:
  contents: read

jobs:
  contar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d9ecb78dbc0c1b0b61f8caae501f59df
    steps:
      - uses: actions/checkout@v4
      - name: Contar contatos ativos por etapa
        working-directory: cloudflare
        shell: bash
        run: |
          set -uo pipefail
          sql="SELECT stage, source, COUNT(*) AS ativos, SUM(CASE WHEN updated_at < strftime('%Y-%m-%dT%H:%M:%fZ','now','-24 hours') THEN 1 ELSE 0 END) AS parados_24h, SUM(CASE WHEN last_contact_at IS NULL THEN 1 ELSE 0 END) AS nunca_contatados, MIN(created_at) AS mais_antigo, MAX(updated_at) AS ultima_mudanca FROM crm_contacts WHERE archived=0 GROUP BY stage, source ORDER BY stage, source"
          npx --yes wrangler@4 d1 execute servidor-nexus --remote --json --command "$sql" > /tmp/out.txt 2>/tmp/err.txt || true
          python3 - <<'PY'
          import json
          t = open('/tmp/out.txt').read(); i = t.find('['); d = json.JSONDecoder(); ok = False
          while i >= 0 and not ok:
              try:
                  v, _ = d.raw_decode(t[i:])
                  if isinstance(v, list) and v and 'results' in v[0]:
                      for r in v[0]['results']: print('::notice::' + json.dumps(r, ensure_ascii=False))
                      ok = True
              except ValueError: pass
              i = t.find('[', i + 1)
          if not ok: print('::error::D1 sem resposta: ' + open('/tmp/err.txt').read()[:300].replace('\n', ' '))
          PY

name: Maskara remover campanha reprovada 24-30 outubro
on:
  push:
    branches: [agendamentos]
    paths: ['.github/workflows/maskara-remover-reprovados.yml']
permissions:
  contents: read
jobs:
  remover:
    runs-on: ubuntu-latest
    steps:
      - name: Remover somente os 42 IDs da campanha rejeitada
        env:
          D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          URL='https://api.cloudflare.com/client/v4/accounts/d9ecb78dbc0c1b0b61f8caae501f59df/d1/database/3d440c4a-8925-4526-8d29-03f9eb227d60/query'
          where="client_id='maskara-assessoria' AND id IN ('upload-carousel-a9cd509f-9fdf-48df-b2e1-e42bf32a9de4','upload-story-f5972913-25c6-46e3-8ea3-3a23f32866ba','upload-feed-2c6bd042-17dd-4780-9dea-8c08a48178b4','upload-story-00979dc7-0e7a-436b-b10c-46026ba9bff9','upload-feed-b44ac63c-af25-4608-9480-99bc7afcd7cb','upload-story-9fde0937-ab08-41bd-a911-dd76f2921ba0','upload-feed-5a9b4c36-0ab5-4ca0-8f6f-e965ee83f0f6','upload-story-71383e8a-8050-4266-9932-812fd96f5aba','upload-reel-b8742193-5b4c-413f-8ae0-01d6ad7df090','upload-story-dd2c51b6-04dd-49ce-b309-23c180cb29f6','upload-feed-2db45b1c-55c4-4e9a-8778-f68144d37b52','upload-story-c579a678-344d-4898-808a-49ed15b84cd3','upload-carousel-8b92af0b-2424-4b26-abda-1eb6fcbdbccc','upload-story-aa4cbe7d-52e7-4ab0-bd34-6e2dd270d427','upload-feed-27878a55-a549-42ed-b004-a9a46aa20a87','upload-story-107cf177-9936-4631-98b7-58acd4c26d84','upload-feed-b0e861a2-897a-4c02-b7a1-9b68669abe6e','upload-story-a55ed200-9e7c-42cc-b9e1-7e1bc252f831','upload-feed-be0cc1a8-0bf0-4bbe-8445-d8be6247ff19','upload-story-f6271ea1-fcc3-4f8b-a53f-d5b7b3a565ba','upload-reel-2769fcb1-791c-4b3b-8693-9cd9bedce5b3','upload-story-86c04533-f737-424e-a4b8-e1e36353c822','upload-feed-240d8a12-0106-41b5-a924-f0c035201484','upload-story-e48c5d77-4d81-4a1c-8b5f-4eeb22d0ed84','upload-carousel-2aae7219-e78d-4f98-9d6e-1faab0cf0beb','upload-story-06e3c204-02e3-41c4-969c-1db33fbbed85','upload-feed-ef057992-7db9-414a-9ddb-03dbffc35273','upload-story-c5aa47bf-661a-4062-ae4b-4b73d082be8a','upload-feed-e2db53a2-2bdf-4c01-a220-d860a8cfc6d1','upload-story-9036e16c-a78a-4a31-9edf-ec2bed724b7f','upload-feed-b678137d-e103-46c4-ba4b-09a2ab73b4f1','upload-story-871c50e1-1830-4e60-a8b9-79b3bd73c1ec','upload-reel-9bb1a990-020c-4c63-9bdf-a705246ee2ff','upload-story-f5a4476b-1864-410d-b24c-cc06eb46c23b','upload-feed-debe8671-b797-4df6-adce-f1f674ca9030','upload-story-50743d7b-e887-46a6-ab52-1be2dccba90c','upload-carousel-6996c9a7-c640-43fe-be73-d8dd0c88ae9b','upload-story-3cbb62cd-abce-4469-9dbe-6a920dbe4a24','upload-feed-70dddee4-74d8-4426-9028-a12a101eda36','upload-story-1ba14a2b-0339-410d-a3cc-0a70ec69a484','upload-feed-27be0d29-d02d-477d-83de-85e986917568','upload-story-c50ee18a-e142-4c5f-88c2-5c45b72d9c1b')"
          def q(sql):
           req=urllib.request.Request(URL,data=json.dumps({'sql':sql}).encode(),headers={'Authorization':'Bearer '+os.environ['D1_TOKEN'],'Content-Type':'application/json'})
           data=json.load(urllib.request.urlopen(req))
           if not data.get('success'): raise RuntimeError('D1 recusou operação')
           return data['result'][0]
          before=q('SELECT COUNT(*) AS n FROM post_ledger WHERE '+where)['results'][0]['n']
          unsafe=q("SELECT COUNT(*) AS n FROM post_ledger WHERE "+where+" AND status IN ('published','publishing')")['results'][0]['n']
          if unsafe:raise RuntimeError('Conteúdo publicado/em publicação encontrado; operação interrompida')
          res=q('DELETE FROM post_ledger WHERE '+where)
          after=q('SELECT COUNT(*) AS n FROM post_ledger WHERE '+where)['results'][0]['n']
          print(json.dumps({'cliente':'maskara-assessoria','ids_autorizados':42,'antes':before,'removidos':res.get('meta',{}).get('changes'),'restantes':after}))
          assert after==0
          
          PY

name: Diagnóstico (só leitura) — artes presas Flow Arts
on:
  push:
    branches: [diag/flowarts-presas]
jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d9ecb78dbc0c1b0b61f8caae501f59df
    steps:
      - uses: actions/checkout@v4
      - name: Posts da Flow Arts que não saíram (somente SELECT)
        working-directory: cloudflare
        run: |
          npx --yes wrangler@4 d1 execute servidor-nexus --remote --json --command "SELECT id, scheduled_for, status, approval_status, json_extract(payload_json,'$.source') AS src, json_extract(payload_json,'$.format') AS fmt, substr(COALESCE(error,''),1,160) AS err, created_at, updated_at, substr(replace(COALESCE(caption,''),char(10),' '),1,70) AS cap FROM post_ledger WHERE client_id='primeiro-teste' AND COALESCE(status,'') NOT IN ('published','posted') AND COALESCE(status,'') NOT LIKE 'cancel%' AND COALESCE(approval_status,'')<>'rejected' AND created_at >= '2026-10-20' ORDER BY scheduled_for" | jq -c '.[0].results[]?' || true
          echo "==== contagem por status (desde 20/10)"
          npx --yes wrangler@4 d1 execute servidor-nexus --remote --json --command "SELECT status, approval_status, COUNT(*) n FROM post_ledger WHERE client_id='primeiro-teste' AND created_at >= '2026-10-20' GROUP BY 1,2" | jq -c '.[0].results[]?' || true

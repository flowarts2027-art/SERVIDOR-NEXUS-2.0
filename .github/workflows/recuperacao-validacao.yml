name: Nexus - validacao segura de recuperacao

on:
  push:
    branches:
      - recovery/nexus-20261010
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria-estatica:
    name: Validar bundle sem deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar codigo da branch
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar sintaxe JavaScript
        run: node --check index.js
      - name: Validar sintaxe do diagnostico Python
        run: python -m py_compile scripts/diagnostico_nexus.py
      - name: Executar diagnostico read-only
        run: python scripts/diagnostico_nexus.py --repo-only

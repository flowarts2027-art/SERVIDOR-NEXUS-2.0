name: NEXUS Core Autonomy

# Redução preventiva de volume (10/11): uma vez ao dia, com acionamento manual sob demanda.
# A função de publicação de posts está no Cloudflare, não neste monitor GitHub.
on:
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:

concurrency:
  group: nexus-core-autonomy
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXUS_HEALTH_URL: https://servidor-nexus.diamantehinode2015.workers.dev/api/autonomy-health
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Self-test Nexus Core routing
        run: node .github/scripts/nexus-core-autonomy.mjs --self-test

      - name: Run autonomous Core cycle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/nexus-core-autonomy.mjs

      # Emergência de publicação em Ragnar desativada: um clique em Run workflow
      # não deve publicar conteúdo real durante a suspensão das contas.

      - name: Upload Core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-core-autonomy-${{ github.run_id }}
          path: /tmp/nexus-core-autonomy-report.json
          if-no-files-found: ignore
          retention-days: 14

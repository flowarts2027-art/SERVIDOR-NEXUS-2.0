name: Escalonar agenda dos painéis Nexus
on:
  pull_request:
    paths:
      - "cloudflare/sql/stagger-panel-schedules.sql"
      - "cloudflare/test/test_panel_slots.py"
      - ".github/workflows/nexus-panel-slots.yml"
  push:
    branches: [main]
    paths:
      - "cloudflare/sql/stagger-panel-schedules.sql"
      - ".github/workflows/nexus-panel-slots.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 cloudflare/test/test_panel_slots.py
  apply:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: nexus-panel-slots
      cancel-in-progress: false
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Distribuir horários atuais e futuros no D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d9ecb78dbc0c1b0b61f8caae501f59df
        run: |
          npx wrangler d1 execute servidor-nexus --remote --yes --file sql/stagger-panel-schedules.sql
          npx wrangler d1 execute servidor-nexus --remote --json --command "SELECT COUNT(*) AS conflicts FROM nexus_panel_slots_v1 a JOIN nexus_panel_slots_v1 b ON a.client_id < b.client_id AND b.ts BETWEEN a.ts-1199 AND a.ts+1199 WHERE a.ts>unixepoch('now') AND b.ts>unixepoch('now') AND a.status_eligible=1 AND b.status_eligible=1" | jq -e '.[0].results[0].conflicts == 0'

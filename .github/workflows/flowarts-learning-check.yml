name: Flow Arts campaign learning checks
on:
  pull_request:
    paths:
      - 'cloudflare/src/flowarts-campaign-learning.js'
      - 'cloudflare/test/flowarts-campaign-learning.test.mjs'
      - '.github/workflows/flowarts-learning-check.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run campaign learning tests
        run: node --test cloudflare/test/flowarts-campaign-learning.test.mjs

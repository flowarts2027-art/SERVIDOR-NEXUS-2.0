name: NEXUS CI

# Só testa. Não implanta, não mexe no banco de produção e não publica nada.
# O deploy é feito pelo deploy-nexus-cloudflare.yml.
# A versão antiga (com passos da Global Play, editor de vídeo e deploy) está
# guardada em docs/legacy/ci-antigo-2026-10-13.yml.txt.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: nexus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check panel JavaScript
        run: |
          node --check public/app.js
          node --check public/client-lite.js

      - name: Check Cloudflare Worker syntax
        shell: bash
        run: |
          for file in cloudflare/src/*.js; do
            node --check "$file"
          done

      - name: Validate Nexus AutoFix safety and self-recovery
        run: |
          node --check .github/scripts/nexus-autofix.mjs
          node --check .github/scripts/nexus-autofix-policy.mjs
          node --test .github/scripts/nexus-autofix.test.mjs
          node .github/scripts/nexus-autofix.mjs --self-test

      - name: Worker tests
        run: node --test cloudflare/test/*.test.mjs

      - name: Video overlay render tests
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core python3-pil >/dev/null
          /usr/bin/python3 -m py_compile scripts/render_overlay_layers.py
          /usr/bin/python3 scripts/test_render_overlay_layers.py
          /usr/bin/python3 scripts/test_render_overlay_mp4.py
          node --check public/video-overlay-core.js
          node --test scripts/test_video_overlay_core.cjs

      - name: Validate Wrangler bundle
        working-directory: cloudflare
        run: |
          npm install --no-audit --no-fund
          npm run check

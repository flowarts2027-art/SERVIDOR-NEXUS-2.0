name: Maskara diagnostico autoreply (temporario)
on:
  push:
    branches: [agendamentos]
    paths: ['.github/workflows/maskara-diagnostico.yml']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Ler estado da resposta automatica
        env:
          D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,re,urllib.request
          url='https://api.cloudflare.com/client/v4/accounts/d9ecb78dbc0c1b0b61f8caae501f59df/d1/database/3d440c4a-8925-4526-8d29-03f9eb227d60/query'
          def q(sql):
              req=urllib.request.Request(url,data=json.dumps({'sql':sql}).encode(),headers={'Authorization':'Bearer '+os.environ['D1_TOKEN'],'Content-Type':'application/json'})
              d=json.load(urllib.request.urlopen(req))
              if not d.get('success'):raise RuntimeError('D1 recusou')
              return d['result'][0]['results']
          def note(t,v):
              s=json.dumps(v,ensure_ascii=False)
              s=re.sub(r'\d{10,13}','<num>',s)
              for i in range(0,len(s),900): print('::notice title='+t+'::'+s[i:i+900])
          note('client',q("SELECT id,status,instagram FROM clients WHERE id='maskara-assessoria'"))
          for r in q("SELECT namespace,item_key,updated_at,value_json FROM nexus_state WHERE client_id='maskara-assessoria' AND namespace IN ('comment-autoreply','ig-webhook-id')"):
              v=json.loads(r['value_json'] or '{}')
              if r['namespace']=='comment-autoreply' and r['item_key']=='config':
                  v={k:v.get(k) for k in ('enabled','keywords','publicReply','updatedAt') if k in v}|{'hasWa':bool(v.get('waText'))}
              elif r['item_key']=='state':
                  v={'lastRun':v.get('lastRun'),'webhook':v.get('webhook'),'lastWebhook':v.get('lastWebhook'),'handled':list((v.get('handled') or {}).values())[-5:]}
              note(r['namespace']+'/'+r['item_key']+' '+r['updated_at'],v)
          for r in q("SELECT value_json FROM nexus_state WHERE namespace='ig-webhook-log' AND client_id='_'"):
              note('webhooklog',(json.loads(r['value_json']).get('items') or [])[:6])
          PY

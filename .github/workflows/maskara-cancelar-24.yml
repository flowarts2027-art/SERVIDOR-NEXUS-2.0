name: Maskara cancelar 6 posts de 24-10 (movidos para hoje)
on:
  push:
    branches: [agendamentos]
    paths: ['.github/workflows/maskara-cancelar-24.yml']
permissions:
  contents: read
jobs:
  cancelar:
    runs-on: ubuntu-latest
    steps:
      - name: Cancelar só os 6 ids de 24/10 que ainda esperam aprovação
        env:
          D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          url='https://api.cloudflare.com/client/v4/accounts/d9ecb78dbc0c1b0b61f8caae501f59df/d1/database/3d440c4a-8925-4526-8d29-03f9eb227d60/query'
          ids=["upload-feed-49a0f5dd-c2f9-4a45-85a5-900da0f1790c","upload-story-84ddd6bb-4956-4bfb-a950-5838674e2c60","upload-feed-151bc92e-bca1-4c2b-8bf0-f139e3d6356b","upload-story-6f16f22d-6c47-49b9-83f8-5120226afe11","upload-feed-9c444b1b-217a-4344-ab1c-05c39163969a","upload-story-6de6fd06-16e7-42f5-a9ca-fa8db47fd381"]
          def q(sql):
            req=urllib.request.Request(url,data=json.dumps({'sql':sql}).encode(),headers={'Authorization':'Bearer '+os.environ['D1_TOKEN'],'Content-Type':'application/json'})
            d=json.load(urllib.request.urlopen(req))
            if not d.get('success'):raise RuntimeError('D1 recusou')
            return d['result'][0]
          lst=",".join("'"+i+"'" for i in ids)
          r=q("UPDATE post_ledger SET status='cancelled',approval_status='rejected',updated_at=CURRENT_TIMESTAMP WHERE client_id='maskara-assessoria' AND id IN ("+lst+") AND status='ready' AND approval_status='pending' AND scheduled_for LIKE '2026-10-24%'")
          print('::notice::cancelados='+str(r.get('meta',{}).get('changes')))
          rows=q("SELECT id,scheduled_for,status,approval_status FROM post_ledger WHERE client_id='maskara-assessoria' AND COALESCE(status,'') NOT LIKE 'cancel%' ORDER BY scheduled_for")['results']
          print('::notice::ativos='+str(len(rows)))
          for x in rows: print('::notice::'+' | '.join(str(x[k]) for k in ['scheduled_for','status','approval_status','id']))
          PY
